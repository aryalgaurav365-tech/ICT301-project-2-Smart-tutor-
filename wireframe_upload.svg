<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" style="background:#fff;font-family:'Courier New',monospace;">
  <rect x="10" y="10" width="780" height="780" rx="4" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="35" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[ TUTOR CONTENT UPLOAD PAGE — Low-Fidelity Wireframe Sketch ]</text>

  <!-- NAV -->
  <rect x="20" y="48" width="760" height="40" rx="3" fill="#e8e8e8" stroke="#888" stroke-width="1.5"/>
  <rect x="30" y="55" width="72" height="26" rx="2" fill="#bbb" stroke="#888"/>
  <text x="66" y="73" text-anchor="middle" font-size="11" fill="#444">LOGO</text>
  <text x="600" y="73" font-size="11" fill="#444">Hi, Tutor ▾</text>
  <rect x="650" y="55" width="120" height="26" rx="12" fill="#4a9eba"/>
  <text x="710" y="73" text-anchor="middle" font-size="11" fill="#fff">Tutor Dashboard</text>

  <!-- Sidebar nav -->
  <rect x="20" y="100" width="150" height="360" rx="4" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5"/>
  <text x="95" y="125" text-anchor="middle" font-size="11" fill="#555">Dashboard</text>
  <line x1="28" y1="132" x2="162" y2="132" stroke="#ddd"/>
  <rect x="28" y="140" width="134" height="28" rx="3" fill="#4a9eba"/>
  <text x="95" y="159" text-anchor="middle" font-size="11" fill="#fff">Upload Content ◄</text>
  <line x1="28" y1="172" x2="162" y2="172" stroke="#ddd"/>
  <text x="95" y="190" text-anchor="middle" font-size="11" fill="#555">My Availability</text>
  <line x1="28" y1="198" x2="162" y2="198" stroke="#ddd"/>
  <text x="95" y="215" text-anchor="middle" font-size="11" fill="#555">Messaging</text>
  <line x1="28" y1="222" x2="162" y2="222" stroke="#ddd"/>
  <text x="95" y="240" text-anchor="middle" font-size="11" fill="#555">Students List</text>

  <!-- Main content area -->
  <rect x="182" y="100" width="596" height="560" rx="4" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <text x="480" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Upload Tutorial Content</text>

  <!-- Form -->
  <text x="200" y="162" font-size="11" fill="#555">Tutorial Title *</text>
  <rect x="198" y="170" width="562" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="210" y="190" font-size="10" fill="#aaa">Enter a clear and descriptive title…</text>

  <text x="200" y="224" font-size="11" fill="#555">Subject / Category *</text>
  <rect x="198" y="232" width="270" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="210" y="252" font-size="10" fill="#aaa">Select subject ▾</text>

  <text x="490" y="224" font-size="11" fill="#555">Difficulty Level</text>
  <rect x="488" y="232" width="272" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="500" y="252" font-size="10" fill="#aaa">Select level ▾</text>

  <text x="200" y="290" font-size="11" fill="#555">Description</text>
  <rect x="198" y="298" width="562" height="64" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="210" y="316" font-size="10" fill="#aaa">Briefly describe what this tutorial covers…</text>

  <text x="200" y="384" font-size="11" fill="#555">Content Type *</text>
  <rect x="198" y="392" width="14" height="14" rx="7" fill="#4a9eba" stroke="#2a7e9a"/>
  <text x="220" y="404" font-size="11" fill="#333">PDF Document</text>
  <rect x="338" y="392" width="14" height="14" rx="7" fill="#fff" stroke="#888"/>
  <text x="360" y="404" font-size="11" fill="#555">External Link</text>

  <!-- PDF Upload area -->
  <rect x="198" y="420" width="562" height="100" rx="6" fill="#f0f8ff" stroke="#4a9eba" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="480" y="455" text-anchor="middle" font-size="28" fill="#4a9eba">⬆</text>
  <text x="480" y="480" text-anchor="middle" font-size="12" fill="#4a9eba">Drag &amp; drop PDF here</text>
  <text x="480" y="498" text-anchor="middle" font-size="10" fill="#888">or click to browse — Max 20 MB</text>
  <text x="480" y="514" text-anchor="middle" font-size="9" fill="#aaa">Accepted: .pdf only</text>

  <!-- Tags -->
  <text x="200" y="545" font-size="11" fill="#555">Tags (optional)</text>
  <rect x="198" y="553" width="562" height="28" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <rect x="206" y="558" width="44" height="16" rx="8" fill="#e8f4fa" stroke="#4a9eba"/>
  <text x="228" y="570" text-anchor="middle" font-size="9" fill="#4a9eba">maths ✕</text>
  <rect x="258" y="558" width="50" height="16" rx="8" fill="#e8f4fa" stroke="#4a9eba"/>
  <text x="283" y="570" text-anchor="middle" font-size="9" fill="#4a9eba">algebra ✕</text>
  <text x="360" y="570" font-size="10" fill="#aaa">Add a tag…</text>

  <!-- Buttons -->
  <rect x="198" y="598" width="180" height="36" rx="4" fill="#4a9eba" stroke="#2a7e9a"/>
  <text x="288" y="621" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Publish Tutorial</text>
  <rect x="394" y="598" width="150" height="36" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="469" y="621" text-anchor="middle" font-size="12" fill="#555">Save as Draft</text>
  <rect x="560" y="598" width="90" height="36" rx="4" fill="#fff" stroke="#e55" stroke-width="1.5"/>
  <text x="605" y="621" text-anchor="middle" font-size="12" fill="#e55">Cancel</text>

  <!-- Note -->
  <rect x="182" y="680" width="596" height="38" rx="3" fill="#fff8e0" stroke="#e5c000" stroke-width="1"/>
  <text x="480" y="698" text-anchor="middle" font-size="10" fill="#777">Note: Once published, content can only be edited or deleted by an Admin.</text>
  <text x="480" y="712" text-anchor="middle" font-size="10" fill="#777">Contact admin if changes are needed after publishing.</text>

  <!-- Footer -->
  <rect x="20" y="738" width="760" height="40" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="763" text-anchor="middle" font-size="10" fill="#666">About Us | Contact Us | © 2025 SmartTutor</text>
</svg>