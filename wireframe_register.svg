<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" style="background:#fff;font-family:'Courier New',monospace;">
  <rect x="10" y="10" width="780" height="880" rx="4" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="35" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[ REGISTRATION PAGE — Low-Fidelity Wireframe Sketch ]</text>

  <!-- NAV -->
  <rect x="20" y="48" width="760" height="40" rx="3" fill="#e8e8e8" stroke="#888" stroke-width="1.5"/>
  <rect x="30" y="55" width="72" height="26" rx="2" fill="#bbb" stroke="#888"/>
  <text x="66" y="73" text-anchor="middle" font-size="11" fill="#444">LOGO</text>
  <rect x="680" y="55" width="88" height="26" rx="12" fill="#4a9eba"/>
  <text x="724" y="73" text-anchor="middle" font-size="11" fill="#fff">Login Instead</text>

  <!-- CARD -->
  <rect x="160" y="108" width="480" height="740" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">Create Your Account</text>
  
  <!-- Role selector -->
  <text x="185" y="175" font-size="11" fill="#555">Select Role:</text>
  <rect x="183" y="183" width="130" height="30" rx="4" fill="#4a9eba" stroke="#2a7e9a"/>
  <text x="248" y="203" text-anchor="middle" font-size="11" fill="#fff">Student</text>
  <rect x="323" y="183" width="130" height="30" rx="4" fill="#fff" stroke="#4a9eba"/>
  <text x="388" y="203" text-anchor="middle" font-size="11" fill="#4a9eba">Tutor</text>
  <rect x="463" y="183" width="130" height="30" rx="4" fill="#fff" stroke="#4a9eba"/>
  <text x="528" y="203" text-anchor="middle" font-size="11" fill="#4a9eba">Admin</text>

  <!-- Form fields -->
  <text x="185" y="238" font-size="11" fill="#555">Full Name *</text>
  <rect x="183" y="244" width="434" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="195" y="264" font-size="10" fill="#aaa">e.g. John Smith</text>

  <text x="185" y="294" font-size="11" fill="#555">Username *</text>
  <rect x="183" y="300" width="434" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>

  <text x="185" y="350" font-size="11" fill="#555">Email Address *</text>
  <rect x="183" y="356" width="434" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="195" y="376" font-size="10" fill="#aaa">email@example.com</text>

  <text x="185" y="406" font-size="11" fill="#555">Confirm Email *</text>
  <rect x="183" y="412" width="434" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>

  <text x="185" y="462" font-size="11" fill="#555">Password *</text>
  <rect x="183" y="468" width="434" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="195" y="488" font-size="10" fill="#aaa">Min 8 characters</text>

  <text x="185" y="518" font-size="11" fill="#555">Confirm Password *</text>
  <rect x="183" y="524" width="434" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>

  <text x="185" y="574" font-size="11" fill="#555">Date of Birth *</text>
  <rect x="183" y="580" width="200" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="195" y="600" font-size="10" fill="#aaa">DD / MM / YYYY</text>

  <text x="185" y="630" font-size="11" fill="#555">Subject(s) of Interest *</text>
  <rect x="183" y="636" width="434" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="195" y="656" font-size="10" fill="#aaa">e.g. Maths, Science, English</text>

  <!-- CAPTCHA box -->
  <rect x="183" y="684" width="200" height="50" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <rect x="193" y="699" width="20" height="20" rx="2" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="225" y="714" font-size="10" fill="#555">I am not a robot</text>
  <rect x="360" y="694" width="40" height="40" rx="2" fill="#ddd" stroke="#aaa"/>
  <line x1="360" y1="694" x2="400" y2="734" stroke="#ccc"/>
  <line x1="400" y1="694" x2="360" y2="734" stroke="#ccc"/>

  <!-- T&C checkbox -->
  <rect x="183" y="750" width="14" height="14" rx="2" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="204" y="762" font-size="10" fill="#555">I agree to the Terms &amp; Conditions and Privacy Policy</text>

  <!-- Submit button -->
  <rect x="183" y="778" width="434" height="38" rx="4" fill="#4a9eba" stroke="#2a7e9a" stroke-width="1.5"/>
  <text x="400" y="803" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Create Account</text>

  <text x="400" y="832" text-anchor="middle" font-size="10" fill="#888">Already have an account? Login here</text>
</svg>