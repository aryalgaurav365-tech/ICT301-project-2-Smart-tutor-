services:
  - type: web
    name: smarttutor-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CAPTCHA_SITE_KEY
        sync: false
      - key: CAPTCHA_SECRET
        sync: false
      - key: DB_SSL
        value: "true"
