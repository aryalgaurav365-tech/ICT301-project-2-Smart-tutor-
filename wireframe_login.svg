<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" style="background:#fff;font-family:'Courier New',monospace;">
  <rect x="10" y="10" width="780" height="680" rx="4" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="35" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[ LOGIN PAGE with 2FA — Low-Fidelity Wireframe Sketch ]</text>

  <!-- NAV -->
  <rect x="20" y="48" width="760" height="40" rx="3" fill="#e8e8e8" stroke="#888" stroke-width="1.5"/>
  <rect x="30" y="55" width="72" height="26" rx="2" fill="#bbb" stroke="#888"/>
  <text x="66" y="73" text-anchor="middle" font-size="11" fill="#444">LOGO</text>
  <rect x="660" y="55" width="108" height="26" rx="12" fill="#555"/>
  <text x="714" y="73" text-anchor="middle" font-size="11" fill="#fff">Create Account</text>

  <!-- Step 1 Card -->
  <rect x="200" y="108" width="400" height="240" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="400" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Step 1 — Sign In</text>
  <text x="215" y="170" font-size="11" fill="#555">Email Address</text>
  <rect x="213" y="178" width="374" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="225" y="198" font-size="10" fill="#aaa">email@example.com</text>
  <text x="215" y="228" font-size="11" fill="#555">Password</text>
  <rect x="213" y="236" width="374" height="30" rx="3" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="225" y="256" font-size="10" fill="#aaa">••••••••</text>
  <text x="575" y="278" text-anchor="end" font-size="10" fill="#4a9eba">Forgot password?</text>
  <rect x="213" y="290" width="374" height="36" rx="4" fill="#4a9eba" stroke="#2a7e9a"/>
  <text x="400" y="313" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Login →</text>
  <text x="400" y="335" text-anchor="middle" font-size="10" fill="#888">New user? Register here</text>

  <!-- Arrow between steps -->
  <line x1="400" y1="348" x2="400" y2="372" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs>
  <text x="410" y="364" font-size="10" fill="#888">If credentials valid</text>

  <!-- Step 2 Card (2FA) -->
  <rect x="200" y="380" width="400" height="210" rx="6" fill="#fafafa" stroke="#4a9eba" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="400" y="410" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Step 2 — Two-Factor Auth (2FA)</text>
  <text x="400" y="435" text-anchor="middle" font-size="10" fill="#666">A 6-digit code was sent to your email</text>
  <text x="215" y="462" font-size="11" fill="#555">Enter 2FA Code</text>
  <!-- 6 digit boxes -->
  <rect x="213" y="470" width="44" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <rect x="267" y="470" width="44" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <rect x="321" y="470" width="44" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <rect x="375" y="470" width="44" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <rect x="429" y="470" width="44" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <rect x="483" y="470" width="44" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="400" y="530" text-anchor="middle" font-size="10" fill="#4a9eba">Resend Code</text>
  <rect x="213" y="542" width="374" height="36" rx="4" fill="#4a9eba" stroke="#2a7e9a"/>
  <text x="400" y="565" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Verify &amp; Access Dashboard</text>

  <!-- Routing note -->
  <rect x="170" y="612" width="460" height="48" rx="4" fill="#fff8e0" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="632" text-anchor="middle" font-size="10" fill="#666">On success: route to Student / Tutor / Admin dashboard</text>
  <text x="400" y="648" text-anchor="middle" font-size="10" fill="#666">based on user role</text>
</svg>